<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>AI Engineer · Entrar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/theme.css">
  <script src="/js/mascot.js" defer></script>
  <style>
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding:
        max(32px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background: var(--bg);
    }

    /* ---------- Fondo: manchas difusas a la deriva ---------- */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(120% 80% at 50% 0%, var(--bg-tint), var(--bg) 70%);
    }
    .blob {
      position: absolute;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .22;
      animation: drift 22s var(--ease) infinite;
      will-change: transform;
    }
    .blob.b1 { background: var(--build);   top: -14vmax; left: -10vmax; }
    .blob.b2 { background: var(--deploy);  bottom: -18vmax; right: -12vmax; animation-duration: 26s; animation-delay: -6s; }
    .blob.b3 { background: var(--test);    top: 38%; left: -20vmax; width: 34vmax; height: 34vmax; opacity: .14; animation-duration: 30s; animation-delay: -12s; }
    .blob.b4 { background: var(--monitor); top: -10vmax; right: -16vmax; width: 36vmax; height: 36vmax; opacity: .16; animation-duration: 28s; animation-delay: -3s; animation-direction: reverse; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .blob { opacity: .17; }
    }
    :root[data-theme="dark"] .blob { opacity: .17; }
    .sky::after {
      /* velo suave para que el texto siempre tenga contraste */
      content: "";
      position: absolute;
      inset: 0;
      background: color-mix(in srgb, var(--bg) 25%, transparent);
    }

    /* ---------- Tarjeta ---------- */
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
    }
    .login {
      padding: 36px 32px 30px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      backdrop-filter: blur(14px) saturate(1.1);
      box-shadow: var(--shadow-lg);
      animation: fade-up var(--t-slow) var(--ease) both;
      transition: opacity .45s var(--ease), transform .45s var(--ease);
    }
    .login.is-shaking { animation: shake .5s var(--ease) both; }
    .login.is-leaving { opacity: 0; transform: translateY(-8px) scale(.985); }

    .brand { display: grid; justify-items: center; text-align: center; gap: 6px; margin-bottom: 26px; }
    .agent {
      display: block;
      width: 88px; height: 88px; /* reserva el espacio antes de que cargue el componente */
      margin-bottom: 12px;
      filter: drop-shadow(0 12px 18px color-mix(in srgb, var(--accent) 32%, transparent));
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .brand h1 { font-size: 26px; }
    .brand p { color: var(--muted); font-size: 14.5px; }

    form { display: grid; gap: 18px; }
    .pw-wrap { position: relative; }
    .pw-wrap .input { padding-right: 48px; }
    .toggle {
      position: absolute; top: 50%; right: 6px;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 0; border-radius: 9px;
      background: transparent;
      color: var(--faint);
      cursor: pointer;
      transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .toggle:hover { color: var(--muted); background: var(--surface-2); }
    .toggle svg { width: 19px; height: 19px; }
    .input[aria-invalid="true"] { border-color: var(--danger); }
    .input[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px var(--danger-soft); }
    .input:disabled { opacity: .6; cursor: not-allowed; }

    .error {
      display: flex; gap: 7px; align-items: flex-start;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 500;
      min-height: 0;
      margin-top: 2px;
      animation: fade-in var(--t) var(--ease);
    }
    .error:empty { display: none; }
    .error svg { flex: none; width: 15px; height: 15px; margin-top: 2px; }

    .submit {
      width: 100%;
      height: 46px;
      position: relative;
      font-size: 15px;
    }
    .submit .spinner, .submit .check { display: none; }
    .submit .spinner {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--on-accent) 35%, transparent);
      border-top-color: var(--on-accent);
      animation: spin .7s linear infinite;
    }
    .submit.is-loading .text, .submit.is-done .text { display: none; }
    .submit.is-loading .spinner { display: block; }
    .submit.is-loading:disabled { opacity: .85; }
    .submit.is-done, .submit.is-done:disabled { background: var(--ok); opacity: 1; box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--ok) 70%, transparent); }
    .submit.is-done .check { display: block; width: 20px; height: 20px; animation: pop .45s var(--ease-spring) both; }
    .submit.is-done .check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .4s .1s var(--ease) forwards; }

    footer {
      position: relative;
      z-index: 1;
      color: var(--faint);
      font-size: 11px;
      text-align: center;
      animation: fade-in var(--t-slow) .3s var(--ease) both;
    }
    body.is-leaving footer { opacity: 0; transition: opacity .45s var(--ease); }

    @media (max-width: 420px) {
      .login { padding: 30px 22px 24px; }
      .brand h1 { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
      .submit.is-done .check path { stroke-dashoffset: 0; }
      .submit .spinner { animation: spin 1.2s linear infinite !important; animation-duration: 1.2s !important; animation-iteration-count: infinite !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <main>
    <section class="card login" id="card" aria-labelledby="title">
      <header class="brand">
        <agent-eyes class="agent" id="agent" face follow size="88" mood="sleep" aria-hidden="true"></agent-eyes>
        <h1 id="title">AI Engineer</h1>
        <p>Tu espacio para convertirte en AI Engineer</p>
      </header>

      <form id="form" novalidate>
        <input type="text" name="username" value="leo" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
        <div class="field">
          <span id="pw-label">Contraseña</span>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="current-password" autocapitalize="off" spellcheck="false"
                   aria-labelledby="pw-label" aria-describedby="error" required autofocus
                   placeholder="••••••••">
            <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
              <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.3 6.9C3.9 8.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5c1.7 0 3.2-.5 4.5-1.2" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                <path d="M3 3l18 18" />
              </svg>
            </button>
          </div>
          <div class="error" id="error" role="alert" aria-live="assertive"></div>
        </div>

        <button type="submit" class="btn submit" id="submit">
          <span class="text">Entrar</span>
          <span class="spinner" aria-hidden="true"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
          <span class="sr-only" id="submit-status"></span>
        </button>
      </form>
    </section>
  </main>

  <footer class="mono">LCAE · proyectos · vacantes</footer>

  <script>
  (() => {
    const card = document.getElementById('card');
    const form = document.getElementById('form');
    const pw = document.getElementById('password');
    const toggle = document.getElementById('toggle');
    const eye = document.getElementById('eye');
    const eyeOff = document.getElementById('eye-off');
    const errorEl = document.getElementById('error');
    const submit = document.getElementById('submit');
    const status = document.getElementById('submit-status');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const agent = document.getElementById('agent');

    /* ---------- El agente ----------
       Despierta al cargar (sleep → idle), sigue el cursor, mira el campo al enfocarlo,
       se pone tímido mientras escribes la contraseña oculta y se asoma si la muestras. */
    const ag = {
      awake: false,
      off: false, // login deshabilitado: se queda dormido
      call(fn, ...args) { if (typeof agent[fn] === 'function') agent[fn](...args); }
    };
    let measureCtx = null;
    // Punto (coords de página) donde está el cursor de texto dentro del campo.
    function caretPoint() {
      const r = pw.getBoundingClientRect();
      const cs = getComputedStyle(pw);
      let w = 0;
      try {
        measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
        measureCtx.font = cs.font || (cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily);
        const end = pw.selectionEnd == null ? pw.value.length : pw.selectionEnd;
        const before = pw.value.slice(0, end);
        w = measureCtx.measureText(pw.type === 'password' ? '•'.repeat(before.length) : before).width;
      } catch (_) {}
      const left = r.left + parseFloat(cs.paddingLeft || 0);
      const x = Math.min(left + w - pw.scrollLeft, r.right - 48);
      return { x: Math.max(left, x) + window.scrollX, y: r.top + r.height / 2 + window.scrollY };
    }
    function syncAgent() {
      if (!ag.awake) return;
      const focused = document.activeElement === pw && !pw.disabled;
      let mood = 'idle';
      if (ag.off) mood = 'sleep';
      else if (focused && pw.type === 'text') mood = 'focus';
      else if (focused && pw.value) mood = 'shy';
      agent.setAttribute('mood', mood);
      if (focused && !ag.off) { const c = caretPoint(); ag.call('lookAt', c.x, c.y); }
      else ag.call('lookAt', null);
    }
    function wakeUp() {
      setTimeout(() => {
        ag.awake = true;
        if (ag.off) return;
        agent.setAttribute('mood', 'idle');
        setTimeout(() => ag.call('blink'), 420);
        // un momento mirando alrededor antes de fijarse en el campo
        setTimeout(syncAgent, reduceMotion ? 0 : 650);
      }, reduceMotion ? 150 : 700);
    }
    if (document.readyState === 'complete') wakeUp();
    else window.addEventListener('load', wakeUp, { once: true });
    ['focus', 'blur', 'input', 'keyup', 'click', 'select'].forEach((ev) => pw.addEventListener(ev, syncAgent));

    const MSG = {
      401: 'Contraseña incorrecta',
      429: 'Demasiados intentos. Espera unos minutos.',
      503: 'El acceso no está configurado en el servidor.',
      network: 'No hay conexión con el servidor.',
      empty: 'Escribe tu contraseña.',
      generic: 'Algo salió mal. Inténtalo de nuevo.'
    };
    const ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.8v3.6M8 11.1v.1"/></svg>';

    let busy = false;
    let disabled = false;

    function goHome() { window.location.replace('/'); }

    function showError(text, { shake = true } = {}) {
      errorEl.innerHTML = ICON + '<span></span>';
      errorEl.lastChild.textContent = text;
      pw.setAttribute('aria-invalid', 'true');
      if (shake && !reduceMotion) {
        card.classList.remove('is-shaking');
        void card.offsetWidth; // reinicia la animación
        card.classList.add('is-shaking');
      }
    }
    function clearError() {
      errorEl.textContent = '';
      pw.removeAttribute('aria-invalid');
    }
    card.addEventListener('animationend', (e) => {
      if (e.animationName === 'shake') card.classList.remove('is-shaking');
    });

    function setLoading(on) {
      busy = on;
      submit.classList.toggle('is-loading', on);
      submit.disabled = on || disabled;
      submit.setAttribute('aria-busy', on ? 'true' : 'false');
      status.textContent = on ? 'Entrando…' : '';
    }

    function disableForm(text) {
      disabled = true;
      ag.off = true;
      agent.setAttribute('mood', 'sleep');
      ag.call('lookAt', null);
      pw.disabled = true;
      toggle.disabled = true;
      submit.disabled = true;
      showError(text, { shake: false });
    }

    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      eye.hidden = show;
      eyeOff.hidden = !show;
      pw.focus({ preventScroll: true });
      const end = pw.value.length;
      try { pw.setSelectionRange(end, end); } catch (_) {}
      syncAgent();
      if (show) ag.call('blink');
    });

    pw.addEventListener('input', () => { if (errorEl.textContent && !disabled) clearError(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy || disabled) return;
      const password = pw.value;
      if (!password) { showError(MSG.empty); ag.call('blink'); pw.focus(); return; }

      clearError();
      setLoading(true);
      let res;
      try {
        res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
          body: JSON.stringify({ password })
        });
      } catch (_) {
        setLoading(false);
        showError(MSG.network);
        ag.call('react', 'sad', 1500);
        pw.focus();
        return;
      }

      if (res.ok) {
        submit.classList.remove('is-loading');
        submit.classList.add('is-done');
        status.textContent = 'Acceso concedido';
        ag.call('lookAt', null);
        ag.call('react', 'happy', 3000);
        const wait = reduceMotion ? 150 : 900;
        setTimeout(() => {
          card.classList.add('is-leaving');
          document.body.classList.add('is-leaving');
          setTimeout(goHome, reduceMotion ? 0 : 420);
        }, wait);
        return;
      }

      setLoading(false);
      if (res.status === 503) { disableForm(MSG[503]); return; }
      showError(MSG[res.status] || MSG.generic);
      ag.call('react', 'sad', res.status === 429 ? 4000 : 1500);
      if (res.status === 401) pw.select();
      pw.focus();
    });

    // Si ya hay sesión, ir directo al tablero; si el login está deshabilitado, avisar.
    fetch('/api/me', { credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch' } })
      .then((r) => (r.ok ? r.json() : null))
      .then((me) => {
        if (!me) return;
        if (me.loggedIn) { goHome(); return; }
        if (me.loginEnabled === false) disableForm(MSG[503]);
      })
      .catch(() => { /* sin conexión: se informará al intentar entrar */ });

    // Volver con el botón "atrás" desde bfcache: restaurar estado.
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted) return;
      card.classList.remove('is-leaving');
      document.body.classList.remove('is-leaving');
      submit.classList.remove('is-done');
      setLoading(false);
      syncAgent();
    });
  })();
  </script>
</body>
</html>
