<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Engineer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
/* AI Engineer: el espacio de Leo para su camino a AI Engineer.
   Shell: barra superior con navegación principal (Inicio, Rutas, Proyectos, Vacantes; barra inferior en teléfono)
   y, dentro de una ruta, una sub-navegación segmentada (Resumen, Plan, Cursos, Exámenes).
   Los datos salen de /data/*.js. Paleta y movimiento salen de theme.css. */

.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1040px;margin:0 auto}
.muted{color:var(--muted)}
agent-eyes{display:inline-block;flex:none;vertical-align:middle}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar1{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font:600 15.5px/1 var(--font-display);letter-spacing:-.01em;color:var(--fg);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand agent-eyes{width:30px;height:30px}
.nav{position:relative;display:flex;gap:2px;margin:0 auto;padding:4px;background:var(--bg-tint);border-radius:12px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;font:500 14px/1 var(--font-body);color:var(--muted);text-decoration:none;transition:color var(--t-fast) var(--ease)}
.nav a:hover{color:var(--fg);text-decoration:none}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a .ic{width:16px;height:16px}
.nav .ic-wrap{display:grid;place-items:center}
.seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:9px;background:var(--surface);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:transform var(--t) var(--ease),width var(--t) var(--ease)}
.seg-ind.no-anim{transition:none}
.logout{display:inline-flex;align-items:center;gap:7px;font:500 13.5px/1 var(--font-body);color:var(--muted);background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.logout:hover{background:var(--surface-2);color:var(--fg)}
.logout .ic{width:16px;height:16px}

/* Sub-navegación de la ruta */
.subbar{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sub-inner{display:flex;align-items:center;gap:18px;height:50px}
.trk{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.trk b{font:600 14px/1 var(--font-display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.trk-sel{font:600 14px/1.2 var(--font-display);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:220px}
.subnav{position:relative;display:flex;gap:2px;padding:3px;background:var(--bg-tint);border-radius:11px}
.subnav a{position:relative;z-index:1;padding:6px 13px;border-radius:8px;font:500 13.5px/1 var(--font-body);color:var(--muted);white-space:nowrap;text-align:center;transition:color var(--t-fast) var(--ease)}
.subnav a:hover{color:var(--fg);text-decoration:none}
.subnav a[aria-current="page"]{color:var(--fg)}
.subnav .seg-ind{top:3px;bottom:3px;border-radius:8px}

/* ---------- Vistas ---------- */
main{padding-top:36px;padding-bottom:80px}
.view{display:grid;gap:40px}
.view.entering{animation:fade-in var(--t) var(--ease)}
.view.entering .rv{animation:fade-up var(--t-slow) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.vhead{display:grid;gap:8px}
.vhead h1{font-size:clamp(26px,4.2vw,34px)}
.vhead .sub{color:var(--muted);font-size:15.5px;max-width:60ch}
.block{display:grid;gap:16px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.block-head h2{font-size:18px}
.block-head a{font-size:14px;display:inline-flex;align-items:center;gap:4px}
.block-head a .ic{width:14px;height:14px}

/* Esqueletos mientras carga */
@keyframes shimmer{to{background-position:-200% 0}}
.is-loading .skl{color:transparent !important;border-radius:8px;background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%) 0 0/200% 100%;animation:shimmer 1.4s linear infinite}
.is-loading .box{border-color:transparent !important;background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%) 0 0/200% 100%;animation:shimmer 1.4s linear infinite}
.is-loading .box svg{display:none}
.sk-block{border-radius:var(--r);background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%) 0 0/200% 100%;animation:shimmer 1.4s linear infinite}

/* Chips y barras */
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--c,var(--accent)) 55%,var(--fg));background:var(--cs,var(--accent-soft));padding:5px 9px;border-radius:99px;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c,var(--accent));transition:width 1s var(--ease)}
.quiet *{transition:none !important}
.st-ok{--c:var(--deploy);--cs:var(--deploy-soft)}
.st-partial{--c:var(--test);--cs:var(--test-soft)}
.st-gap{--c:var(--monitor);--cs:var(--monitor-soft)}
.sbar{display:flex;gap:3px;height:8px}
.sbar i{flex:none;display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width 1s var(--ease)}


/* ---------- Checkbox ---------- */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.task{position:relative;display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background var(--t-fast) var(--ease)}
.task:hover{background:var(--surface-2)}
.task input,.cchk input{position:absolute;opacity:0;margin:0;cursor:pointer}
.task input{left:10px;top:9px;width:22px;height:22px}
.box{flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--faint) 80%,transparent);background:var(--surface);transition:background var(--t) var(--ease),border-color var(--t) var(--ease)}
.box svg{width:13px;height:13px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.box path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--t) var(--ease) 60ms}
input:checked + .box{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
input:checked + .box path{stroke-dashoffset:0}
input:hover:not(:checked) + .box{border-color:var(--c,var(--accent))}
input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.box.pop{animation:pop .38s var(--ease-spring)}
.ttext{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.tt{background:linear-gradient(currentColor,currentColor) no-repeat 0 60%/0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size var(--t) var(--ease),color var(--t) var(--ease)}
input:checked ~ .ttext .tt{background-size:100% 1px;color:var(--muted)}
.kind{font:400 11.5px/1.4 var(--font-mono);color:var(--faint)}
.tasks.lg .task{padding:12px 12px;font-size:15.5px;gap:14px}
.tasks.lg .task input{left:12px;top:12px;width:24px;height:24px}
.tasks.lg .box{width:24px;height:24px;border-radius:8px}
.tasks.lg .box svg{width:15px;height:15px}

/* ---------- Inicio ---------- */
.hello{display:flex;align-items:center;gap:22px}
.hello agent-eyes{width:72px;height:72px}
.hello .vhead{min-width:0}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.span2{grid-column:1/-1}
.rcard{padding:24px 26px 18px;display:grid;gap:18px}
.rc-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.rc-main{display:grid;gap:12px;min-width:0}
.rc-title{display:grid;gap:6px}
.rc-title h2{font-size:21px}
.rc-stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.rc-stat{display:grid;gap:2px}
.rc-stat b{font:600 22px/1.1 var(--font-display);letter-spacing:-.02em;justify-self:start}
.rc-stat span{font-size:13px;color:var(--muted)}
.rc-next{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:16px}
.rc-next-body{flex:1;min-width:0;display:grid;gap:4px}
.rc-next-body .label{padding-left:2px}
.rc-next .tasks{margin:0 -12px}
.rc-next .btn{flex:none;text-decoration:none}
.rc-next .btn .ic{width:16px;height:16px}
.ring-wrap.sm{width:100px;height:100px}
.ring-wrap.sm .ring-center b{font-size:23px}
.ring-wrap.sm .ring-center span{font-size:11px}
.pminis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.mini{display:grid;gap:12px;align-content:start;padding:20px 22px;color:var(--fg);transition:border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
a.mini:hover{text-decoration:none;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mini-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mini h3{font-size:17px}
.mini p{font-size:14px;color:var(--muted)}
.mini-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mini-foot b{font:500 13px var(--font-mono);color:var(--fg)}
.mini .big{font:600 28px/1 var(--font-display);letter-spacing:-.03em}
.mini .big small{font:500 15px var(--font-display);color:var(--muted);letter-spacing:0;margin-left:2px}
.soon{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--muted)}
.soon h3{font-size:16px;color:var(--fg);margin-bottom:4px}
.soon p{font-size:14px}
.soon-ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--bg-tint);color:var(--muted)}
.soon-ic .ic{width:18px;height:18px}

/* ---------- Resumen ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:center;padding:26px 30px}
.ring-wrap{position:relative;width:136px;height:136px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring-track{stroke:var(--accent-soft)}
.ring-val{stroke:url(#ring-grad);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.3s var(--ease)}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center}
.ring-center b{font:600 30px/1 var(--font-display);letter-spacing:-.03em}
.ring-center span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{display:grid;gap:6px;align-content:start;padding:2px 22px;border-left:1px solid var(--line)}
.stat .label{display:flex;align-items:center;gap:6px}
.stat .label .ic{width:14px;height:14px}
.stat b{font:600 32px/1.05 var(--font-display);letter-spacing:-.03em;justify-self:start}
.stat b small{font:500 15px var(--font-display);color:var(--muted);letter-spacing:0;margin-left:2px}
.stat .sub{font-size:13px;color:var(--muted)}
.stat .ok,.rc-stat .ok{color:var(--ok)}

.wcard{padding:22px 22px 14px;display:grid;gap:14px}
.wc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:0 2px}
.wc-head h3{font-size:19px;margin-top:10px}
.wc-dates{font-size:13.5px;color:var(--muted);margin-top:4px}
.wc-count{font:600 22px/1 var(--font-display);letter-spacing:-.02em;white-space:nowrap}
.wcard > .bar{margin:0 2px 4px}
.wcard .tasks{margin:0 -8px}
.wcard.complete .wc-count{color:var(--ok)}
@keyframes celebrate{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}70%{box-shadow:0 0 0 16px color-mix(in srgb,var(--c) 0%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.wcard.celebrate,.tl-item.celebrate .tl-card{animation:celebrate 1s var(--ease) 2}
.tl-item.celebrate .tl-dot{animation:pop .5s var(--ease-spring)}

.next{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;border-radius:var(--r-lg);background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.next-body{display:grid;gap:6px;min-width:0}
.next h3{font-size:17px}
.next-meta{font-size:14px;color:var(--muted)}
.next .btn{flex:none;text-decoration:none}
.next .btn .ic{width:16px;height:16px}
.next-empty{padding:18px 20px;border-radius:var(--r-lg);border:1px dashed var(--line);color:var(--muted)}

.domains{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 28px}
.dom{display:grid;gap:9px}
.dom-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:500}
.dom-top span:first-child{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.dom-pct{font:500 13px var(--font-mono);color:var(--muted)}

/* ---------- Plan ---------- */
.timeline{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:6px}
.timeline::before{content:"";position:absolute;left:15px;top:26px;bottom:26px;width:2px;border-radius:2px;background:var(--line)}
.tl-item{position:relative;padding-left:42px}
.tl-dot{position:absolute;left:8px;top:21px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);display:grid;place-items:center;transition:background var(--t) var(--ease),border-color var(--t)}
.tl-dot svg{width:9px;height:9px;fill:none;stroke:var(--on-accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--t)}
.tl-item.complete .tl-dot{background:var(--c);border-color:var(--c)}
.tl-item.complete .tl-dot svg{opacity:1}
.tl-item.now .tl-dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.tl-card{border-radius:var(--r);border:1px solid transparent;transition:background var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t)}
.tl-item.open .tl-card{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.tl-head{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 18px;padding:14px 16px;background:none;border:0;border-radius:var(--r);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background var(--t-fast)}
.tl-item:not(.open) .tl-head:hover{background:var(--surface-2)}
.tl-main{display:grid;gap:4px;min-width:0}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.tl-dates{font-size:13px;color:var(--muted)}
.now-pill{font:500 11px/1 var(--font-mono);letter-spacing:.04em;color:var(--on-accent);background:var(--accent);padding:4px 8px;border-radius:99px}
.tl-title{font:600 16.5px/1.25 var(--font-display);letter-spacing:-.015em;transition:color var(--t)}
.tl-item.complete:not(.open) .tl-title{color:var(--muted)}
.tl-right{display:flex;align-items:center;gap:14px}
.tl-count{font:500 13px var(--font-mono);color:var(--muted);min-width:34px;text-align:right}
.tl-item.complete .tl-count{color:var(--ok)}
.tl-right .bar{width:72px}
.chev{color:var(--faint);transition:transform var(--t) var(--ease)}
.tl-item.open .chev{transform:rotate(180deg)}
.tl-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t) var(--ease)}
.tl-item.open .tl-panel{grid-template-rows:1fr}
.tl-inner{min-height:0;overflow:hidden}
.tl-inner .tasks{padding:0 6px 10px}

/* ---------- Cursos ---------- */
.croad{padding:6px 18px}
.crows{list-style:none;margin:0;padding:0}
.crow{display:grid;grid-template-columns:22px 8px minmax(0,1fr) auto 32px;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cnum{font:500 12px var(--font-mono);color:var(--faint)}
.cmain{display:grid;gap:3px;min-width:0}
.cname{display:inline;font-weight:600;color:var(--fg);justify-self:start}
.cname .ic{display:inline-block;vertical-align:-2px;margin-left:5px;width:14px;height:14px;color:var(--faint);transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
.cname:hover{color:var(--accent-strong);text-decoration:none}
.cname:hover .ic{color:var(--accent-strong);transform:translate(1px,-1px)}
.cname span{background:linear-gradient(currentColor,currentColor) no-repeat 0 60%/0 1px;transition:background-size var(--t) var(--ease)}
.crow.is-done .cname{color:var(--muted)}
.crow.is-done .cname span{background-size:100% 1px}
.cmeta{font-size:13.5px;color:var(--muted)}
.cweek{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.wk-m{display:none}
.cchk{position:relative;display:grid;place-items:center;width:32px;height:32px;cursor:pointer}
.cchk input{inset:0;width:100%;height:100%}
.extra-wrap{display:grid;gap:10px}
.extra-wrap .crows{padding:0 18px}
.extra .crow{padding:12px 0}
.extra .cname{font-weight:500}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 24px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--fg);font-size:14.5px}
.links a .ic{width:14px;height:14px;color:var(--faint)}
.links a:hover{color:var(--accent-strong);text-decoration:none}
.links a:hover .ic{color:var(--accent-strong)}

/* ---------- Exámenes ---------- */
.score-card{padding:22px 24px;display:grid;gap:16px}
.sf-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end}
.sfield > span{display:flex;align-items:center;gap:7px}
.sfield .input{font-family:var(--font-display);font-size:18px;font-weight:500;padding:11px 14px}
.sfield .input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.sf-fields .btn{height:47px}
.ferr{min-height:20px;font-size:13.5px;color:var(--danger)}
.ex-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px;align-items:start}
.chart{width:100%;height:210px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font:400 11px var(--font-mono);fill:var(--faint)}
.chart .pass{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 5}
.chart .ax.pass-t{fill:var(--ok);font-weight:500}
.chart .tot{font:500 12px var(--font-mono);fill:var(--muted)}
.chart .tot.ok{fill:var(--ok)}
.chart .dt{font:400 11px var(--font-mono);fill:var(--muted)}
.chart rect{stroke:var(--bg);stroke-width:1.5}
@keyframes grow{from{transform:scaleY(0)}}
.chart .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s var(--ease) both;animation-delay:var(--d,0ms)}
.chart .fade{animation:fade-in .5s var(--ease) both;animation-delay:calc(var(--d,0ms) + 400ms)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dash{width:16px;height:0;border-top:1.5px dashed var(--ok)}
.brows{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.brow{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px}
.brow .bar{height:8px;overflow:visible;position:relative}
.brow .bar i{border-radius:99px}

<script>
/* ---------- Datos (de /data/*.js) ---------- */
const TRACKS = window.TRACKS || [];
const PROJECTS = window.PROJECTS || [];
const JOBS = window.JOBS || [];
const SEC = ["build","test","deploy","monitor"];   // columnas de lcae_scores
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = s => { const d = new Date(s+"T12:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()]; };

/* Índice global de tareas: id -> {txt, kind, track, week} */
const TASK = {};
TRACKS.forEach(t=>t.weeks.forEach((w,i)=>w.tasks.forEach(([id,txt,kind])=>{ TASK[id] = {id, txt, kind, track:t.id, week:i}; })));

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const TZ = "America/Mexico_City";
const keyFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const dayKey = d => keyFmt.format(d);
const prevKey = k => { const d = new Date(k+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); };
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const RING_C = 2*Math.PI*52;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

const ICON = {
  home:"M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",
  route:"M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 17h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16",
  layers:"M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5",
  brief:"M4 7h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M3 13h18",
  plan:"M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01",
  chart:"M18 20V10M12 20V4M6 20v-6",
  logout:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  ext:"M7 17L17 7M8 7h9v9",
  arrow:"M5 12h14M13 6l6 6-6 6",
  plus:"M12 5v14M5 12h14",
  check:"M5 12.5l4.5 4.5L19 7.5",
  chev:"M6 9l6 6 6-6",
  x:"M18 6L6 18M6 6l12 12",
  code:"M16 18l6-6-6-6M8 6l-6 6 6 6",
  calendar:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  flame:"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z",
  target:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",
  info:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01",
  okc:"M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3",
};
const icon = (n, cls="ic") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const BOX = `<span class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${ICON.check}"/></svg></span>`;
$$("[data-icon]").forEach(el=>{ el.innerHTML = icon(el.dataset.icon); el.style.display = "inline-grid"; });

/* ---------- Estado ---------- */
let done = {};      // taskId -> iso string (truthy = hecho)
let attempts = [];  // [{id, at, build, test, deploy, monitor}]
let pending = 0;    // escrituras en curso; el refresco no pisa cambios optimistas
let loaded = false, ready = false, lastData = "", view = null;
let trackId = TRACKS.some(t=>t.id===store.get("aie-track")) ? store.get("aie-track") : (TRACKS[0]||{}).id;
let builtTrack = null, lastSub = "resumen";
const T = () => TRACKS.find(t=>t.id===trackId) || TRACKS[0];

const ids = t => t.weeks.flatMap(w=>w.tasks.map(x=>x[0]));
const prog = list => { const n = list.filter(id=>done[id]).length; return {n, t:list.length, p:list.length ? Math.round(n/list.length*100) : 0}; };
const weekDone = (t,i) => t.weeks[i].tasks.filter(x=>done[x[0]]).length;
const daysTo = t => t.examDate ? Math.max(0, Math.ceil((new Date(t.examDate+"T09:00:00") - new Date())/864e5)) : null;
const dvars = d => `--c:var(--${d});--cs:var(--${d}-soft)`;

function curWeek(t){
  const k = dayKey(new Date());
  if(k < t.weeks[0].from) return 0;
  const i = t.weeks.findIndex(w=>k>=w.from && k<=w.to);
  return i < 0 ? t.weeks.length-1 : i;
}
/* Siguiente tarea: la primera pendiente, en orden del plan. */
function nextTask(t){
  for(let i=0;i<t.weeks.length;i++){ const x = t.weeks[i].tasks.find(k=>!done[k[0]]); if(x) return {task:x, week:i}; }
  return null;
}
function streak(){
  const days = new Set(Object.values(done).filter(Boolean).map(v=>dayKey(new Date(v))));
  let k = dayKey(new Date());
  if(!days.has(k)) k = prevKey(k);   // hoy aún cuenta si ayer hubo avance
  let n = 0;
  while(days.has(k)){ n++; k = prevKey(k); }
  return n;
}
const ST = {ok:"Cubierto", partial:"Parcial", gap:"Falta"};
function reqState(r){
  const pr = prog(r.tasks||[]);
  if(r.status === "ok") return {s:"ok", pr};
  if(pr.t && pr.n === pr.t) return {s: r.cover === "part" ? "partial" : "ok", pr};
  if(r.status === "partial" || pr.n > 0) return {s:"partial", pr};
  return {s:"gap", pr};
}
const jobCount = j => { const c = {ok:0, partial:0, gap:0}; j.reqs.forEach(r=>c[reqState(r).s]++); return c; };
const pStatus = (p, pr) => p.status || (pr.p === 100 ? "Listo" : pr.n > 0 ? "En curso" : "Por empezar");

/* ---------- Plantillas ---------- */
function taskItem([id,txt,kind], prefix){
  return `<li><label class="task" for="${prefix}-${id}"><input type="checkbox" id="${prefix}-${id}" data-id="${id}"${done[id]?" checked":""}${ready?"":" disabled"}>${BOX}<span class="ttext"><span class="tt">${txt}</span>${kind?`<span class="kind">${kind}</span>`:""}</span></label></li>`;
}
const taskById = (id, prefix) => taskItem(TASK[id] ? [id, TASK[id].txt] : [id, id], prefix);
const ring = (cls="") => `<div class="ring-wrap ${cls}">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-track" cx="60" cy="60" r="52"/><circle class="ring-val" cx="60" cy="60" r="52" data-ring data-p="0"/></svg>
    <div class="ring-center"><b class="num skl" data-k="pct">00%</b><span class="skl" data-k="pct-sub">0 de 00 tareas</span></div></div>`;

/* ---------- Inicio, Proyectos, Vacantes (se construyen una vez) ---------- */
function buildHome(){
  const t = T();
  $("v-inicio").innerHTML = `
    <div class="hello rv" style="--i:0">
      <agent-eyes face follow size="72" id="home-agent" aria-hidden="true"></agent-eyes>
      <div class="vhead"><p class="label" data-k="today">&nbsp;</p><h1 id="ini-h">Hola, Leo</h1>
        <p class="sub"><span class="skl" data-k="hsub">Cargando tu avance…</span></p></div>
    </div>
    <div class="home">
      <section class="card rcard span2 rv" style="--i:1" aria-labelledby="ra-h" id="rcard"></section>
      <section class="block span2 rv" style="--i:2" aria-labelledby="pm-h">

/* ---------- Actualización ---------- */
function countUp(el, to, html=""){
  if(RM.matches || loaded){ el.innerHTML = to+html; return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.innerHTML = Math.round(to*e)+html; if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const setNum = (k, v, html="") => $$(`[data-k="${k}"]`).forEach(el=>countUp(el, v, html));
const setText = (k, v) => $$(`[data-k="${k}"]`).forEach(el=>{ el.textContent = v; });

function greeting(){
  const h = +new Intl.DateTimeFormat("en-US",{hour:"numeric",hourCycle:"h23",timeZone:TZ}).format(new Date());
  const g = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
  const el = $("ini-h"); if(el) el.textContent = g+", Leo";
  setText("today", new Intl.DateTimeFormat("es-MX",{weekday:"long",day:"numeric",month:"long",timeZone:TZ}).format(new Date()));
}

let lastNext;
function renderNext(t){
  const el = $("next-course");
  if(!el) return;
  const C = t.courses || [];
  const i = C.findIndex(c=>!done[c[0]]);
  if(i === lastNext) return;
  lastNext = i;
  if(i < 0){ el.innerHTML = `<p class="next-empty">Terminaste la ruta de cursos. Repasa con el practice exam.</p>`; return; }
  const [,slug,name,dom,les,when,why] = C[i];
  el.innerHTML = `<div class="next" style="${dvars(dom)}">
    <div class="next-body"><p class="label">Curso ${i+1} de ${C.length} · ${when}</p><h3>${name}</h3>
      <p class="next-meta">${les?les+" lecciones · ":""}${why}</p></div>
    <a class="btn" href="${(t.acad||"")+slug}" target="_blank" rel="noopener">Abrir curso${icon("ext")}</a></div>`;
}

function update(){
  const t = T();
  if(t){
    const st = prog(ids(t)), CUR = curWeek(t);
    setNum("pct", st.p, "%");
    setText("pct-sub", `${st.n} de ${st.t} tareas`);
    $$("[data-ring]").forEach(r=>{ r.dataset.p = st.p; });
    const d = daysTo(t); if(d != null) setNum("days", d);
    const s = streak();
    setNum("streak", s);
    setText("streak-sub", s === 1 ? "día seguido" : "días seguidos");
    if(t.exam){
      const best = attempts.reduce((m,a)=>Math.max(m,total(a)), -1);
      $$('[data-k="best"]').forEach(el=>{
        if(best < 0) el.innerHTML = `–<small>/${t.exam.total}</small>`; else countUp(el, best, `<small>/${t.exam.total}</small>`);
        el.classList.toggle("ok", best >= t.exam.pass);
      });
    }
    t.weeks.forEach((w,i)=>{
      const c = weekDone(t,i), n = w.tasks.length;
      $$(`[data-wcount="${i}"]`).forEach(el=>{ el.textContent = `${c}/${n}`; });
      $$(`[data-wbar="${i}"]`).forEach(el=>{ el.dataset.w = Math.round(c/n*100); });
      $$(`[data-week="${i}"]`).forEach(el=>el.classList.toggle("complete", c===n));
    });
    const wc = weekDone(t,CUR), left = t.weeks[CUR].tasks.length - wc;
    setText("wk-count", `${wc}/${t.weeks[CUR].tasks.length}`);
    const leftTxt = left === 0 ? "Semana completa. Buen ritmo, sigue así."
      : left === 1 ? "Te queda 1 tarea esta semana." : `Te quedan ${left} tareas esta semana.`;
    setText("wsub", leftTxt);
    setText("hsub", `Llevas ${st.p}% de la ruta ${t.short}. ${leftTxt}`);
    (t.domains||[]).forEach(([k])=>{
      const p = prog(t.weeks.filter(w=>w.dom===k).flatMap(w=>w.tasks.map(x=>x[0]))).p;
      $$(`[data-dpct="${k}"]`).forEach(el=>{ el.textContent = p+"%"; });
      $$(`[data-dbar="${k}"]`).forEach(el=>{ el.dataset.w = p; });
    });
    $$(".crow").forEach(r=>r.classList.toggle("is-done", !!done[r.dataset.cid]));
    renderNext(t);
    clearTimeout(homeNextT);
    if(homeNextId === undefined || !loaded) renderHomeNext();
    else homeNextT = setTimeout(renderHomeNext, 700);   // deja ver la palomita antes de pasar a la siguiente
  }

  PROJECTS.forEach(p=>{
    const pr = prog(p.milestones.flatMap(m=>m.tasks));
    $$(`[data-ppct="${p.id}"]`).forEach(el=>{ el.textContent = pr.p+"%"; });
    $$(`[data-pbar="${p.id}"]`).forEach(el=>{ el.dataset.w = pr.p; });
    $$(`[data-pcount="${p.id}"]`).forEach(el=>{ el.textContent = `${pr.n}/${pr.t} tareas`; });
    const s = pStatus(p, pr), dom = pr.p === 100 ? "deploy" : pr.n > 0 ? "accent" : "setup";
    $$(`[data-pstatus="${p.id}"]`).forEach(el=>{ el.textContent = s; el.style.cssText = dom === "accent" ? "" : dvars(dom); });
    p.milestones.forEach((m,mi)=>{
      const c = prog(m.tasks);
      $$(`[data-mscount="${p.id}-${mi}"]`).forEach(el=>{ el.textContent = `${c.n}/${c.t}`; });
      $$(`[data-ms="${p.id}-${mi}"]`).forEach(el=>el.classList.toggle("complete", c.n === c.t));
    });
  });

  JOBS.forEach(j=>{
    const c = jobCount(j), n = j.reqs.length;
    $$(`[data-jok="${j.id}"]`).forEach(el=>{ el.innerHTML = `${c.ok}<small>/${n}</small>`; });
    ["ok","partial","gap"].forEach(k=>$$(`[data-jbar="${j.id}-${k}"]`).forEach(el=>{ el.dataset.w = c[k]/n*100; }));
    $$(`[data-jsum="${j.id}"]`).forEach(el=>{ el.textContent = `${c.partial} ${c.partial===1?"parcial":"parciales"} · ${c.gap} ${c.gap===1?"falta":"faltan"}`; });
    j.reqs.forEach((r,ri)=>{
      const rs = reqState(r);
      $$(`[data-rq="${j.id}-${ri}"]`).forEach(el=>{ el.textContent = ST[rs.s]; el.className = "chip st-"+rs.s; });
      $$(`[data-rqp="${j.id}-${ri}"]`).forEach(el=>{ el.textContent = `${rs.pr.n}/${rs.pr.t} tareas`; });
    });
  });
  paint();
}

/* Barras y anillos: se pintan solo en la vista visible, así animan desde 0 al entrar. */
function paint(){
  const root = view && $("v-"+view);
  if(!root) return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$("[data-w]", root).forEach(el=>{ el.style.width = `calc(${el.dataset.w}% - ${el.closest(".sbar") && +el.dataset.w ? 2 : 0}px)`; });
    $$("[data-ring]", root).forEach(r=>{ r.style.strokeDashoffset = RING_C*(1 - (+r.dataset.p||0)/100); });
  }));
}

function syncChecks(){
  document.body.classList.add("quiet");
  $$("input[data-id]").forEach(i=>{ i.checked = !!done[i.dataset.id]; i.disabled = false; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove("quiet")));
}

/* ---------- Exámenes ---------- */
const total = a => SEC.reduce((s,k)=>s+a[k], 0);

function renderScores(){
  const t = T(), box = $("scores");
  if(!box || !t.exam) return;
  const E = t.exam, doms = t.domains;
  if(!attempts.length){
    box.innerHTML = `<div class="empty">
      <span class="empty-ic">${icon("target")}</span>
      <h2>Aún no hay intentos</h2>
      <p>Haz el practice exam diagnóstico para ver de dónde partes. Luego registra aquí tu puntaje.</p>
      <a class="btn" href="${E.practice}" target="_blank" rel="noopener">Hacer el diagnóstico${icon("ext")}</a></div>`;
    return;
  }
  const last = attempts[attempts.length-1];
  box.innerHTML = `<div class="ex-grid">
    <section class="block" aria-labelledby="ch-h">
      <div class="block-head"><h2 id="ch-h">Intentos</h2><span class="label">total / ${E.total}</span></div>
      <div><div class="chart" id="chart"></div>
      <div class="legend">${doms.map(([k,l])=>`<span style="--c:var(--${k})"><i class="dot"></i>${l}</span>`).join("")}<span><i class="dash"></i>${E.pass} aprueba</span></div></div>
    </section>
    <section class="block" aria-labelledby="lt-h">
      <div class="block-head"><h2 id="lt-h">Último intento</h2><span class="label">${fmt(last.at)}</span></div>
      <ul class="brows">${doms.map(([k,l])=>`<li class="brow" style="${dvars(k)}"><span>${l}</span><div class="bar" aria-hidden="true"><i data-w="${last[k]*10}"></i></div><span class="bval num">${last[k]}/${E.per}</span></li>`).join("")}</ul>
      <p class="hint">La marca indica 7/10, el ritmo para aprobar.</p>
    </section></div>
    <section class="block" aria-labelledby="hs-h" style="margin-top:40px">
      <div class="block-head"><h2 id="hs-h">Historial</h2><span class="label">${attempts.length} ${attempts.length===1?"intento":"intentos"}</span></div>
      <ul class="hist">${attempts.slice().reverse().map(a=>{
        const s = total(a), tmp = String(a.id).startsWith("tmp-");
        return `<li class="hrow"><span class="hdate">${fmt(a.at)}</span>
          <span class="hparts">${doms.map(([k,l])=>`<span style="--c:var(--${k})"><i class="dot"></i><span class="sr-only">${l}</span>${a[k]}</span>`).join("")}</span>
          <span class="htot num${s>=E.pass?" pass":""}">${s}/${E.total}</span>
          ${tmp?"<span></span>":`<button type="button" class="del" data-del="${a.id}" aria-label="Borrar intento del ${fmt(a.at)}" title="Borrar">${icon("x")}</button>`}</li>`;
      }).join("")}</ul>
    </section>`;
  drawChart(true);
  paint();
}

function drawChart(animate){
  const el = $("chart");
  if(!el) return;
  const W = el.clientWidth;
  if(!W) return;
  const E = T().exam, doms = T().domains;
  const H = 210, pt = 24, pb = 28, pl = 30, pr = 8, iw = W-pl-pr, ih = H-pt-pb, n = attempts.length;
  const slot = iw/n, bw = Math.max(10, Math.min(40, slot*.5));
  const y = v => pt + ih - v/E.total*ih;
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw/52))));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntaje total por intento: ${attempts.map(a=>fmt(a.at)+" "+total(a)+" de "+E.total).join(", ")}">`;
  [0,10,20,40].forEach(v=>{ s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  s += `<line class="pass" x1="${pl}" x2="${W-pr}" y1="${y(E.pass)}" y2="${y(E.pass)}"/><text class="ax pass-t" x="${pl-8}" y="${y(E.pass)+4}" text-anchor="end">${E.pass}</text>`;
  attempts.forEach((a,i)=>{
    const cx = pl + slot*i + slot/2, x = cx - bw/2;
    let acc = 0;
    s += `<g class="${animate?"grow":""}" style="--d:${i*60}ms">`;
    doms.forEach(([k])=>{ const v = a[k]; if(!v) return;
      s += `<rect x="${x}" y="${y(acc+v)}" width="${bw}" height="${v/E.total*ih}" rx="3" style="fill:var(--${k})"/>`; acc += v; });
    s += `</g><text class="tot${acc>=E.pass?" ok":""}${animate?" fade":""}" style="--d:${i*60}ms" x="${cx}" y="${y(acc)-8}" text-anchor="middle">${acc}</text>`;
    if(i % every === 0 || i === n-1) s += `<text class="dt" x="${cx}" y="${H-8}" text-anchor="middle">${fmt(a.at)}</text>`;
  });
  el.innerHTML = s + `</svg>`;
}
let rz;
addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(view==="examenes") drawChart(false); placeInds(false); }, 120); });

/* ---------- API ---------- */
class HttpError extends Error{ constructor(status, msg){ super(msg); this.status = status; } }

async function api(method, url, body){
  const opts = {method, credentials:"same-origin", headers:{"X-Requested-With":"fetch"}};
  if(body !== undefined){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try{ res = await fetch(url, opts); }
  catch(e){ throw new HttpError(0, "Sin conexión"); }
  if(res.status === 401){ location.href = "/login"; throw new HttpError(401, "Inicia sesión"); }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new HttpError(res.status, (data && data.error) || "Error "+res.status);
  return data;
}

function toast(msg, kind="info"){
  const t = document.createElement("div");
  t.className = "toast "+kind;
  t.innerHTML = icon(kind==="ok"?"okc":"info")+`<span></span>`;
  t.lastChild.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 400); }, kind==="error"?5000:3200);
}
const fail = (err, msg) => { if(err.status !== 401) toast(err.status === 0 ? "Sin conexión. Intenta de nuevo." : msg, "error"); };

/* ---------- El agente: se alegra al completar, se duerme sin actividad ---------- */
const agents = () => $$("agent-eyes");
const SLEEP_MS = 120000;
let asleep = false, idleT = 0, lastAct = 0;
function sleepNow(){ asleep = true; agents().forEach(a=>a.setAttribute("mood","sleep")); }
function wake(){
  const now = Date.now();
  if(asleep){ asleep = false; agents().forEach(a=>a.setAttribute("mood","idle")); }
  else if(now - lastAct < 1000) return;   // no reiniciar el reloj en cada pixel
  lastAct = now;
  clearTimeout(idleT);
  idleT = setTimeout(sleepNow, SLEEP_MS);
}
["pointerdown","pointermove","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev, wake, {passive:true}));
wake();
/* Cualquier parte de la app puede avisar: document.dispatchEvent(new CustomEvent("aie:task-done", {detail:{id}})) */
document.addEventListener("aie:task-done", ()=>{
  wake();
  agents().forEach(a=>{ if(typeof a.react === "function") a.react("happy", 1400); });
});

/* ---------- Carga y refresco ---------- */
async function loadProgress(){
  const data = await api("GET", "/api/progress");
  if(pending > 0) return;           // no pisar cambios optimistas en curso
  const json = JSON.stringify(data);
  if(json === lastData) return;
  lastData = json;
  done = data.done || {};
  attempts = (data.scores || []).map(s=>({id:s.id, at:String(s.at).slice(0,10),
    build:+s.build, test:+s.test, deploy:+s.deploy, monitor:+s.monitor}));
  ready = true;
  syncChecks();
  update();
  renderScores();
  if(!loaded){ loaded = true; document.body.classList.remove("is-loading"); }
}

async function refresh(){
  try{ await loadProgress(); }
  catch(err){ fail(err, "No se pudo cargar el progreso."); }
}

/* ---------- Escrituras ---------- */
function celebrate(i){
  $$(`[data-week="${i}"]`).forEach(el=>{ el.classList.remove("celebrate"); void el.offsetWidth; el.classList.add("celebrate");
    setTimeout(()=>el.classList.remove("celebrate"), 2100); });
  toast(`Semana ${i} completa. Bien hecho.`, "ok");
}

document.addEventListener("change", async e=>{
  const inp = e.target;
  if(inp.id === "trk-sel"){ location.hash = `#ruta/${inp.value}/${lastSub}`; return; }
  if(!inp.matches("input[data-id]")) return;
  const id = inp.dataset.id, val = inp.checked, prev = done[id];
  const info = TASK[id], t = info && TRACKS.find(x=>x.id===info.track);
  const wi = info ? info.week : null, before = t ? weekDone(t,wi) : 0;
  if(val) done[id] = new Date().toISOString(); else delete done[id];
  $$(`input[data-id="${id}"]`).forEach(i=>{ i.checked = val; });
  if(val){ const b = inp.nextElementSibling; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    document.dispatchEvent(new CustomEvent("aie:task-done", {detail:{id}})); }
  update();
  if(val && t && before < t.weeks[wi].tasks.length && weekDone(t,wi) === t.weeks[wi].tasks.length){
    if(t.id === builtTrack) celebrate(wi); else toast(`Semana ${wi} completa. Bien hecho.`, "ok");
  }
  pending++;
  try{ await api("PUT", "/api/done/"+encodeURIComponent(id), {done:val}); lastData = ""; }
  catch(err){
    if(prev) done[id] = prev; else delete done[id];
    syncChecks(); update();
    fail(err, "No se pudo guardar. Intenta de nuevo.");
  }
  finally{ pending--; }
});

/* Acordeón del plan */
document.addEventListener("click", e=>{
  const head = e.target.closest(".tl-head");
  if(!head) return;
  const item = head.closest(".tl-item"), open = !item.classList.contains("open");
  item.classList.toggle("open", open);
  head.setAttribute("aria-expanded", open);
  $(head.getAttribute("aria-controls")).inert = !open;
  if(open) paint();
});

/* Formulario de puntajes */
function validate(showEmpty){
  const per = T().exam.per;
  let msg = "";
  SEC.forEach(k=>{
    const inp = $("s-"+k), v = inp.value.trim();
    let bad = false;
    if(v === ""){ if(showEmpty){ bad = true; msg = msg || "Completa las 4 secciones."; } }
    else if(!/^\d+$/.test(v) || +v > per){ bad = true; msg = `Usa números enteros del 0 al ${per}.`; }
    inp.setAttribute("aria-invalid", bad);
  });
  $("s-err").textContent = msg;
  return !msg;
}
document.addEventListener("input", e=>{ if(e.target.closest("#score-form")) validate(false); });

document.addEventListener("submit", async e=>{
  if(e.target.id !== "score-form") return;
  e.preventDefault();
  const form = e.target;
  if(!validate(true)){ $$('#score-form [aria-invalid="true"]')[0]?.focus(); return; }
  const body = {}; SEC.forEach(k=>{ body[k] = +$("s-"+k).value; });
  const tmp = {id:"tmp-"+Date.now(), at:dayKey(new Date()), ...body};
  attempts = [...attempts, tmp];
  renderScores(); update();
  $("s-save").disabled = true;
  pending++;
  try{
    const row = await api("POST", "/api/scores", body);
    attempts = attempts.map(a=>a===tmp ? {id:row.id, at:String(row.at).slice(0,10),
      build:+row.build, test:+row.test, deploy:+row.deploy, monitor:+row.monitor} : a);
    lastData = "";
    form.reset();
    toast(`Intento guardado: ${total(body)}/${T().exam.total}.`, "ok");
  }catch(err){
    attempts = attempts.filter(a=>a!==tmp);
    fail(err, err.status === 400 ? "Puntajes inválidos (0 a 10)." : "No se pudo guardar el intento.");
  }finally{
    pending--;
    if($("s-save")) $("s-save").disabled = false;
    renderScores(); update();
  }
});

document.addEventListener("click", async e=>{
  const btn = e.target.closest("[data-del]");
  if(!btn) return;
  const id = btn.dataset.del;
  const idx = attempts.findIndex(a=>String(a.id) === id);
  if(idx < 0) return;
  const removed = attempts[idx];
  attempts = attempts.filter(a=>a!==removed);
  renderScores(); update();
  pending++;
  try{ await api("DELETE", "/api/scores/"+encodeURIComponent(id)); lastData = ""; toast("Intento borrado."); }
  catch(err){
    attempts = [...attempts]; attempts.splice(Math.min(idx, attempts.length), 0, removed);
    renderScores(); update();
    fail(err, "No se pudo borrar el intento.");
  }
  finally{ pending--; }
});

/* Sesión */
$("logout").addEventListener("click", async ()=>{
  try{ await api("POST", "/api/logout"); }catch(e){}
  location.href = "/login";
});

/* ---------- Navegación por hash ---------- */
const VIEWS = ["inicio","resumen","plan","cursos","examenes","proyectos","vacantes"];
const SUBS = ["resumen","plan","cursos","examenes"];
const OLD = {hoy:"resumen", plan:"plan", cursos:"cursos", examenes:"examenes"};   // hashes del tablero anterior

function parse(){
  let h = location.hash.slice(1);
  if(OLD[h] && TRACKS.some(t=>t.id==="lcae")){ h = "ruta/lcae/"+OLD[h]; history.replaceState(null, "", "#"+h); }
  if(h === "ruta" || h === "rutas") return {view:lastSub, track:trackId};
  const m = h.match(/^ruta\/([a-z0-9-]+)(?:\/([a-z]+))?$/);
  if(m){
    const t = TRACKS.find(x=>x.id===m[1]);
    if(t){ let s = SUBS.includes(m[2]) ? m[2] : "resumen"; if(s === "examenes" && !t.exam) s = "resumen"; return {view:s, track:t.id}; }
  }
  if(h === "proyectos" || h === "vacantes") return {view:h};
  return {view:"inicio"};
}

function placeInd(nav, anim){
  const ind = nav.querySelector(".seg-ind"), a = nav.querySelector('a[aria-current="page"]');
  if(!ind) return;
  if(!a || !a.offsetWidth){ ind.style.width = "0px"; return; }
  ind.classList.toggle("no-anim", !anim);
  ind.style.width = a.offsetWidth+"px";
  ind.style.transform = `translateX(${a.offsetLeft}px)`;
}
const placeInds = anim => { placeInd($("nav"), anim); if(!$("subbar").hidden) placeInd($("subnav"), anim); };

function route(){
  const r = parse();
  const first = view === null;
  let trackChanged = false;
  if(r.track && r.track !== builtTrack){
    trackId = r.track; store.set("aie-track", trackId);
    buildTrack(); renderRouteCard();
    trackChanged = true;
    if(ready){ syncChecks(); update(); }
  }
  if(r.view === view && !trackChanged) return;
  const subWasHidden = $("subbar").hidden;
  view = r.view;
  const group = SUBS.includes(view) ? "rutas" : view;
  if(group === "rutas") lastSub = view;
  VIEWS.forEach(x=>{
    const sec = $("v-"+x);
    if(x === view){ sec.hidden = false; sec.classList.remove("entering"); void sec.offsetWidth; sec.classList.add("entering"); }
    else sec.hidden = true;
  });
  $$("#nav a").forEach(a=>{ if(a.dataset.p === group) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $$("#subnav a").forEach(a=>{ if(a.dataset.s === view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("nav").querySelector('[data-p="rutas"]').href = `#ruta/${trackId}/${lastSub}`;
  $("subbar").hidden = group !== "rutas";
  placeInd($("nav"), !first);
  if(group === "rutas") placeInd($("subnav"), !first && !subWasHidden);
  const cur = $("subnav").querySelector('[aria-current="page"]');
  if(cur && group === "rutas") cur.scrollIntoView({block:"nearest", inline:"nearest"});
  if(!first) scrollTo({top:0, behavior:"instant"});
  if(view === "examenes") drawChart(true);
  paint();
}
addEventListener("hashchange", route);

/* ---------- Arranque ---------- */
buildHome();
renderRouteCard();
buildProjects();
buildJobs();
buildTrack();
greeting();
renderHomeNext();
route();
document.fonts && document.fonts.ready.then(()=>placeInds(false));
refresh();
setInterval(()=>{ if(document.visibilityState === "visible"){ greeting(); refresh(); } }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") refresh(); });
